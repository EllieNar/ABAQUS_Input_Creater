[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "abaqus-file-creator"
version = "0.1.0"
description = "Generate Abaqus input files for perforated thin-walled I-beams."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]